services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
    networks:
      - iot-net

  influxdb:
    image: influxdb:2.7
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=pic2026pass
      - DOCKER_INFLUXDB_INIT_ORG=esei
      - DOCKER_INFLUXDB_INIT_BUCKET=iot_data
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=supermercado-token-2026
      - DOCKER_INFLUXDB_INIT_RETENTION=30d
    volumes:
      - influxdb_data:/var/lib/influxdb2
    networks:
      - iot-net

  simulators:
    build: ./simulators
    depends_on:
      - mosquitto
    environment:
      - MQTT_BROKER=mosquitto
      - PYTHONUNBUFFERED=1
    restart: on-failure
    networks:
      - iot-net

  ingestion:
    build: ./ingestion
    depends_on:
      - mosquitto
      - influxdb
    environment:
      - MQTT_BROKER=mosquitto
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=supermercado-token-2026
      - INFLUX_ORG=esei
      - INFLUX_BUCKET=iot_data
      - PYTHONUNBUFFERED=1
    restart: on-failure
    networks:
      - iot-net

  api:
    build: ./api
    depends_on:
      - influxdb
    ports:
      - "5000:5000"
    environment:
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=supermercado-token-2026
      - INFLUX_ORG=esei
      - INFLUX_BUCKET=iot_data
      - PYTHONUNBUFFERED=1
    networks:
      - iot-net

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana 
    networks:
      - iot-net

volumes:
  influxdb_data:
  grafana_data:

networks:
  iot-net:
    name: supermercado-iot-network